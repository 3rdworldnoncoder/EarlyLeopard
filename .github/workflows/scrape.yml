name: Early Leopard Scraper

on:
  schedule:
    - cron: "0 */4 * * *"   # every 4 hours
  workflow_dispatch:          # allow manual trigger from GitHub UI
    inputs:
      full:
        description: "Full backfill? (pass --full)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      audio_backfill:
        description: "Run audio backfill only?"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper (incremental)
        if: ${{ github.event.inputs.full != 'true' && github.event.inputs.audio_backfill != 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scraper.py

      - name: Run scraper (full backfill)
        if: ${{ github.event.inputs.full == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scraper.py --full

      - name: Backfill audio for existing video posts
        if: ${{ github.event.inputs.audio_backfill == 'true' || github.event_name == 'schedule' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python backfill_audio.py
